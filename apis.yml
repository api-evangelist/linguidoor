name: Linguidoor
description: >-
  Linguidoor is a Berlin-based, ISO-branded human translation and localization agency serving
  businesses and individuals across Germany and internationally. It offers professional translation
  in 100+ languages, website / app / software / game localization, MTPE, certified and sworn document
  translation for German administrative processes (birth and marriage certificates, driving licences,
  Anmeldung, Schufa, diplomas), interpretation, subtitling and captioning, voice-over and dubbing,
  transcription, desktop publishing, content writing, international SEO, and AI data services
  (data annotation, tagging and labeling, voice and text data collection, text-to-speech and voice
  cloning). Pricing is published per translated word across three service tiers, with fixed-price
  certified document translations sold through an online shop. Linguidoor publishes NO developer
  program: enrichment found no OpenAPI, AsyncAPI, GraphQL, MCP server, agent card, SDK, CLI or API
  documentation of any kind. The site is WordPress + WooCommerce on Hostinger; its only machine-readable
  surfaces are the platform-default WordPress REST API at /wp-json/ (which includes the public
  unauthenticated WooCommerce Store API) and a plugin-generated llms.txt whose entire content is the
  default WordPress "Hello world!" post.
